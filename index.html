<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Notas Avanzada</title>
    <link rel="stylesheet" href="style.css">
</head>
<>
    <div class="container">
        <h1>🎯 Gestor de materias</h1>
            <select id="selectorMaterias" onchange="cambiarMateria()" class="selector­­-materias">
            
            </select>

            <button onclick="crearNuevaMateria()" class="btn-nueva-materia">
                + Nueva Materia
            </button>
    </div>

    <div class="materia­-actual">
        <input type="text" id="nombreMateriaActual"
            placeholder="Nombre de la materia" oninput="guardarNombreMateria()"
            onblur="guardarNombreMateria()">
    </div>

    <label><strong>Tu nombre:</strong></label>
    <input type="text" id="nombreUsuario" placeholder="Escribe tu nombre" oninput="guardarNombre()">

    <label><strong>Escala:</strong></label>
    <select id="escala" onchange="cambiarEscala()">
        <option value="7">Escala 1.0 - 7.0</option>
        <option value="10">Escala 0 - 10</option>
        <option value="20">Escala 0 - 20</option>
        <option value="100">Escala 0 - 100</option>
    </select>

    </div>

        <h3>Evaluaciones:</h3>
        <div id="evaluaciones"></div>

        <button onclick="agregarEvaluacion()">+ Agregar Evaluación</button>

        <h3>Nota Objetivo Final:</h3>
        <input type="number" id="notaObjetivo" step="0.1" value="4.0" min="1" max="7">

        <button onclick="calcularTodo()" class="calcular-btn">Calcular qué necesito</button>

        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
    <script src="app.js"></script>
</body>
</html>
