<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎯 Calculadora de Notas</h1>
        
        <label><strong>Escala de evaluación:</strong></label>
        <select id="escala" onchange="cambiarEscala()">
            <option value="7">1.0 - 7.0 (Chile)</option>
            <option value="100">0 - 100 (Porcentaje)</option>
        </select>

        <label>Nota actual:</label>
        <input type="number" id="notaActual" step="0.1" value="4.0" min="1" max="7">

        <label>Porcentaje ya evaluado (%):</label>
        <input type="number" id="porcentajeActual" step="1" value="40" min="0" max="100">

        <label>Nota objetivo:</label>
        <input type="number" id="notaObjetivo" step="0.1" value="4.0" min="1" max="7">

        <button onclick="calcular()">Calcular qué necesito</button>
        
        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
